---
# =============================================================
# cPanel Git Version Control — deploy automático do backend
# =============================================================
# A cada "Deploy HEAD Commit" no cPanel, ele atualiza o clone do
# repositório e executa as tarefas abaixo, na ordem.
#
# Como funciona SEM SSH/terminal:
#   - rsync copia backend/* para a pasta do app (Application root)
#   - o pip/migrate/collectstatic rodam usando o Python da venv
#     criada pelo "Setup Python App" (caminho absoluto, sem ativar)
#   - tocar em tmp/restart.txt reinicia o Passenger automaticamente
#
# ------------------------------------------------------------
# AJUSTE ESTAS DUAS LINHAS ANTES DO PRIMEIRO DEPLOY:
#
#   DEPLOYPATH = a "Application root" definida no Setup Python App
#                (ex.: /home/SEU_USUARIO/acapra_backend)
#
#   VENVPATH   = o caminho da virtualenv que o Setup Python App
#                mostra na linha "source .../bin/activate".
#                Copie tudo ATÉ antes de "/bin/activate".
#                (ex.: /home/SEU_USUARIO/virtualenv/acapra_backend/3.11)
# ------------------------------------------------------------
#
# A cópia PRESERVA no servidor (nunca sobrescreve dados/segredos):
#   .env, db.sqlite3, media/, staticfiles/ e a venv.
# =============================================================
deployment:
  tasks:
    - export DEPLOYPATH=/home/acapra/acapra_backend
    - export VENVPATH=/home/acapra/virtualenv/acapra_backend/3.12.13
    - /bin/mkdir -p $DEPLOYPATH
    - /usr/bin/rsync -a --exclude='.env' --exclude='.env.*' --exclude='db.sqlite3' --exclude='media/' --exclude='staticfiles/' --exclude='venv/' --exclude='__pycache__/' --exclude='*.pyc' backend/ $DEPLOYPATH/
    - $VENVPATH/bin/pip install --upgrade pip
    - $VENVPATH/bin/pip install -r $DEPLOYPATH/requirements.prod.txt
    - cd $DEPLOYPATH && $VENVPATH/bin/python manage.py migrate --noinput
    - cd $DEPLOYPATH && $VENVPATH/bin/python manage.py collectstatic --noinput
    - /bin/mkdir -p $DEPLOYPATH/tmp && /bin/touch $DEPLOYPATH/tmp/restart.txt
