name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execucao anterior do mesmo branch. Sem isto, uma
# sequencia de commits enfileira execucoes que ja nasceram obsoletas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 'Backend — testes, migracoes e check de deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: Projeto_acapra_CI
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-somente-para-testes-nao-usar-em-producao-0123456789abcdef
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: Projeto_acapra_CI
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Migracoes estao completas
        run: python manage.py makemigrations --check --dry-run

      - name: Configuracao de producao esta segura
        # SECURE_SSL_REDIRECT so vale AQUI. Se ficasse no env do job, o
        # SecurityMiddleware responderia 301 a todas as requisicoes do test
        # client e a suite inteira quebraria.
        env:
          SECURE_SSL_REDIRECT: 'True'
        run: python manage.py check --deploy --fail-level WARNING

      - name: Suite de testes
        run: python manage.py test

  frontend:
    name: 'Frontend — lint, testes e build'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitarios
        run: npm test

      - name: Build de producao
        env:
          # O Vite so expoe variaveis com o prefixo VITE_.
          VITE_API_BASE_URL: https://acapra.org.br
          VITE_MEDIA_BASE_URL: https://acapra.org.br/api
        run: npm run build
