<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACAPRA | Em manutencao</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/manutencao.css" />
  </head>
  <body>
    <main class="maintenance-page">
      <div class="bg-shape bg-shape-top" aria-hidden="true"></div>
      <div class="bg-shape bg-shape-bottom" aria-hidden="true"></div>

      <section class="maintenance-card" aria-label="Pagina em manutencao">
        <img src="/acapra-logo-com-texto.png" alt="Logo ACAPRA" class="brand-logo" />

        <p class="tag">Aviso</p>
        <h1>Em manutencao</h1>
        <p class="description">
          Estamos ajustando o sistema para voltar com uma experiencia melhor.
          Obrigado pela paciencia.
        </p>

        <div class="status-row" role="status" aria-live="polite">
          <span class="pulse" aria-hidden="true"></span>
          <span>Equipe trabalhando agora</span>
        </div>
      </section>
    </main>
  </body>
</html>
